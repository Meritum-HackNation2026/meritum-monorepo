# Dependabot version updates: one weekly PR per ecosystem for minor and patch
# (grouped), separate PRs for major, at most 5 open per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: CI
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
